name: CI

on:
  push:
  workflow_dispatch:

jobs:
  rspec:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # docker-compose.yml と同じ構成にすることで、database.yml (host: db) と
    # spec/rails_helper.rb (http://chrome:4444/wd/hub) をそのまま使えるようにする
    container:
      image: ruby:3.0.7

    services:
      db:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: password
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      chrome:
        image: selenium/standalone-chrome:3.141.59-titanium
        options: --shm-size=2g

    env:
      RAILS_ENV: test
      BUNDLE_PATH: vendor/bundle
      BUNDLE_WITHOUT: production

    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends default-libmysqlclient-dev imagemagick

      - name: Install bundler
        run: gem install bundler -v 2.4.22

      - name: Cache gems
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: bundle-ruby-3.0.7-${{ hashFiles('Gemfile.lock') }}
          restore-keys: bundle-ruby-3.0.7-

      - name: Install gems
        run: bundle install --jobs 4

      - name: Set up database
        run: bin/rails db:create db:schema:load

      - name: Run RSpec
        run: bundle exec rspec

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
